<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeración en Tiempo Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .number {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .number:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

    <h2>Selecciona un número:</h2>
    <div id="number-container" class="container"></div>

    <script>
        const container = document.getElementById("number-container");

        // Recuperar números desde localStorage o inicializar con valores del 1 al 10
        let numbers = JSON.parse(localStorage.getItem("numbers")) || Array.from({ length: 10 }, (_, i) => i + 1);

        function renderNumbers() {
            container.innerHTML = ""; // Limpiar la lista antes de actualizar
            numbers.forEach(num => {
                const button = document.createElement("button");
                button.textContent = num;
                button.classList.add("number");
                button.onclick = () => removeNumber(num);
                container.appendChild(button);
            });
        }

        function removeNumber(num) {
            numbers = numbers.filter(n => n !== num);
            localStorage.setItem("numbers", JSON.stringify(numbers)); // Guardar en localStorage
            renderNumbers(); // Volver a renderizar la lista
        }

        // Renderizar números al cargar la página
        renderNumbers();
    </script>

</body>
</html>
