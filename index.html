<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona un Número</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .number {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .number:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

    <h2>Selecciona un número:</h2>
    <div id="number-container" class="container"></div>

    <script>
        const container = document.getElementById("number-container");
        const totalNumbers = 180; // Puedes cambiar el rango de números

        // Recuperar números desde localStorage o inicializar con valores del 1 al totalNumbers
        let selectedNumbers = JSON.parse(localStorage.getItem("selectedNumbers")) || [];
        let availableNumbers = Array.from({ length: totalNumbers }, (_, i) => i + 1).filter(n => !selectedNumbers.includes(n));

        function renderNumbers() {
            container.innerHTML = ""; // Limpiar la lista antes de actualizar
            availableNumbers.forEach(num => {
                const button = document.createElement("button");
                button.textContent = num;
                button.classList.add("number");
                button.onclick = () => selectNumber(num);
                container.appendChild(button);
            });
        }

        function selectNumber(num) {
            selectedNumbers.push(num);
            localStorage.setItem("selectedNumbers", JSON.stringify(selectedNumbers)); // Guardar en localStorage
            availableNumbers = availableNumbers.filter(n => n !== num); // Eliminar el número de la lista disponible
            renderNumbers(); // Volver a renderizar la lista
        }

        // Renderizar números al cargar la página
        renderNumbers();
    </script>

</body>
</html>
